name: Build APK Free
on:
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Unzip Project
# NOTE: Make sure your exact zip file name is inside the quotes below!
run: |
unzip "faucet-tracker-pro-oct-9-2026-12-31-38-am (1).zip"
mv faucet-tracker-pro-* project
- name: Setup Java
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
- name: Setup Gradle
uses: gradle/actions/setup-gradle@v3
- name: Build APK
run: |
cd project
touch .env
chmod +x gradlew
./gradlew assembleDebug --no-daemon
- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: MyFreeApp
path: project/app/build/outputs/apk/debug/
