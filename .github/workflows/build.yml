name: Build APK Free

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: unzip "faucet-tracker-pro-oct-9-2026-12-31-38-am (1).zip" -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          cd project
          touch .env
          gradle assembleDebug--no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFreeApp
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
